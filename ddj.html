<!DOCTYPE html>
<html lang="zh-Hans">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>道德经帛书版 · 1-81章</title>
  <style>
    :root {
      --paper: #f3f2ee;
      --ink: #1a1a1a;
      --rule: rgba(13, 13, 13, 0.5);
      --bg: #dde0dc;
    }

    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
    }

    body {
      padding: 28px 18px 28px 220px;
    }

    .toc {
      position: fixed;
      left: 20px;
      top: 28px;
      width: 180px;
      max-height: calc(100vh - 56px);
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    .toc-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 8px;
      border-bottom: 1px solid var(--rule);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .toc-toggle {
      display: none;
    }

    .toc-inner {
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      padding: 10px 8px;
    }

    .toc-link {
      display: block;
      width: 100%;
      text-align: left;
      padding: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      line-height: 1.5;
      letter-spacing: 0.04em;
    }

    .toc-chapter {
      display: block;
      font-size: 20px;
      line-height: 1.5;
      /* font-weight: bold; */
    }

    .toc-summary {
      display: block;
      font-size: 18px;
      letter-spacing: 0.08em;
      color: rgba(26, 26, 26, 0.76);
    }

    .toc-link:hover,
    .toc-link:focus {
      border-color: var(--ink);
      background: rgba(0, 0, 0, 0.02);
      outline: none;
    }

    #app {
      max-width: 1200px;
      margin: 0 auto;
    }

    .chapter-page {
      width: min(100%, 980px);
      margin: 0 auto 30px;
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
    }

    .chapter-title {
      text-align: center;
      font-size: clamp(28px, 2.6vw, 48px);
      line-height: 1.3;
      padding: 24px 0 20px;
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .chapter-lines {
      padding: 0 36px 12px;
    }

    .chapter-line {
      border-top: 1px solid var(--rule);
      padding: 18px 10px 12px;
    }

    .chapter-text {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 0.1rem 0.1rem;
      text-align: center;
    }

    .char-cell {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-width: 1.85em;
      min-height: 3.1em;
      padding: 0 0.06em;
    }

    .char-cell--punct {
      min-width: 0.5em;
    }

    .char-pinyin {
      display: block;
      min-height: 1.2em;
      font-size: clamp(18px, 0.9vw, 18px);
      line-height: 1.2;
      /* letter-spacing: 0.02em; */
      color: rgba(26, 26, 26, 0.86);
      white-space: nowrap;
      margin-bottom: 0.2rem;
      order: 0;
      font-weight: 700;
    }

    .char-text {
      display: block;
      font-size: clamp(22px, 2vw, 38px);
      line-height: 1.3;
      /* letter-spacing: 0.1em; */
      color: var(--ink);
      order: 1;
    }

    @media (max-width: 750px) {
      body {
        padding: 12px 0;
      }

      .toc {
        left: 0;
        top: 0;
        width: auto;
        /* border:none; */
        /* box-shadow: none; */
      }

      .toc-text {
        display: none;
      }

      .toc-header {
        justify-content: flex-start;
        padding: 0;
        border: none;
        background: transparent;
      }

      .toc-toggle {
        position: fixed;
        right: 15px;
        top: 15px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border: 2px solid var(--ink);
        background: transparent;
        color: var(--ink);
        font-size: 22px;
        cursor: pointer;
      }

      .toc-inner {
        display: none;
        max-height: 280px;
        padding: 8px 10px 12px;
      }

      .toc.is-open .toc-inner {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 10px;
      }

      .toc-link {
        flex: 1 1 calc(33.333% - 10px);
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .toc-chapter,
      .toc-summary {
        display: inline-block;
      }

      .chapter-page {
        border-width: 2px;
      }

      .chapter-lines {
        padding: 0 5px 10px;
      }

      .chapter-line {
        padding: 10px 0;
      }
    }

    @media (max-width: 600px) {
      .char-pinyin {
        font-size: 16px;
      }

      .char-text {
        font-size: 18px;
      }

      .toc-link {
        flex: 1 calc(50% - 10px);
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .toc-chapter {
        font-size: 18px;
      }

      .toc-summary {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

    <div id="toc-inner" class="toc-inner"></div>
  </nav>
  <div id="app"></div>

      49: [

      50: [

      51: [

      52: [

      53: [

      54: [

      55: [

      56: [

      57: [

    const app = document.getElementById('app');
    const tocInner = document.getElementById('toc-inner');

    function setupMobileToc() {
      const toc = document.querySelector('.toc');
      const toggle = document.querySelector('.toc-toggle');
      if (!toc || !toggle) return;

      toggle.addEventListener('click', () => {
        const isOpen = toc.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', String(isOpen));
        toggle.setAttribute('aria-label', isOpen ? '收起目录' : '展开目录');
      });
    }

    function renderToc(ordered) {
      if (!tocInner) return;

      tocInner.innerHTML = ordered
        .map((num) => {
          const summary = chapterSummaries[num] || '玄德无名';
          return `
              <button class="toc-link" type="button" data-target="chapter-${num}">
                <span class="toc-chapter">第 ${num} 章</span>
                <span class="toc-summary">${summary}</span>
              </button>
            `;
        })
        .join('');

      tocInner.querySelectorAll('.toc-link').forEach((button) => {
        button.addEventListener('click', () => {
          const targetId = button.getAttribute('data-target');
          const target = document.getElementById(targetId);
          if (target) {
            const rect = target.getBoundingClientRect();
            const targetTop = window.pageYOffset + rect.top - 12;

            window.scrollTo({
              top: targetTop,
              behavior: 'smooth'
            });
          }
          const toc = document.querySelector('.toc');
          if (toc && window.innerWidth <= 750) {
            toc.classList.remove('is-open');
            const toggle = document.querySelector('.toc-toggle');
            if (toggle) {
              toggle.setAttribute('aria-expanded', 'false');
              toggle.setAttribute('aria-label', '展开目录');
            }
          }
        });
      });
    }

    function splitPinyinTokens(raw) {
      return String(raw || '')
        .replace(/[,，。！？；：、]/g, ' ')
        .trim()
        .split(/\s+/)
        .filter(Boolean);
    }

    function buildAlignedCells(text, pinyin) {
      const chars = Array.from(String(text || ''));
      const syllables = splitPinyinTokens(pinyin);
      const cells = [];
      let syllableIndex = 0;

      for (const ch of chars) {
        const isHan = /[\u4e00-\u9fff]/.test(ch);

        if (!isHan) {
          cells.push({
            char: ch,
            pinyin: '',
            className: 'char-cell char-cell--punct'
          });
          continue;
        }

        const pinyinValue = syllables[syllableIndex] || '';
        syllableIndex += 1;

        cells.push({
          char: ch,
          pinyin: pinyinValue,
          className: 'char-cell'
        });
      }

      return cells;
    }

    function renderAlignedLine(text, pinyin) {
      const cells = buildAlignedCells(text, pinyin);

      return `
          <div class="chapter-line">
            <div class="chapter-text">
              ${cells.map((cell) => `
                <span class="${cell.className}">
                  <span class="char-text">${cell.char}</span>
                  <span class="char-pinyin">${cell.pinyin || '&nbsp;'}</span>
                </span>
              `).join('')}
            </div>
          </div>
        `;
    }

    function renderChapter(num, lines) {
      const section = document.createElement('section');
      section.className = 'chapter-page';
      section.id = `chapter-${num}`;

      const lineMarkup = lines.map(([text, pinyin]) => renderAlignedLine(text, pinyin)).join('');

      section.innerHTML = `
          <div class="chapter-title">第 ${num} 章</div>
          <div class="chapter-lines">${lineMarkup}</div>
        `;

      return section;
    }

    function renderAll() {
      if (!app) return;
      const ordered = Object.keys(chapterData)
        .map(Number)
        .sort((a, b) => a - b);

      renderToc(ordered);
      setupMobileToc();

      ordered.forEach((num) => {
        const lines = chapterData[num];
        if (Array.isArray(lines) && lines.length) {
          app.appendChild(renderChapter(num, lines));
        }
      });
    }

    document.addEventListener('DOMContentLoaded', renderAll);
  </script>
